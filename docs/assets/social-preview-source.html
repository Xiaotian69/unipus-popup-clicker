<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Unipus Popup Clicker Social Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 1fr 410px;
      align-items: center;
      gap: 60px;
      padding: 76px 88px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #182136;
      background:
        radial-gradient(circle at 92% 4%, rgba(108, 93, 204, .24), transparent 380px),
        linear-gradient(135deg, #f7f9fc, #e6ebf4);
    }
    .kicker { color: #6659ba; font-size: 18px; font-weight: 800; letter-spacing: .17em; }
    h1 { margin: 22px 0 24px; font-size: 62px; line-height: 1.05; letter-spacing: -.045em; }
    p { margin: 0; color: #5d6980; font-size: 20px; font-weight: 700; }
    .card {
      position: relative;
      padding: 36px;
      border: 1px solid rgba(82, 91, 124, .18);
      border-radius: 26px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 30px 65px rgba(50, 60, 85, .18);
    }
    .icon { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 20px; background: #ece9fd; color: #6557bf; font-size: 30px; font-weight: 900; }
    .line { height: 13px; margin-top: 24px; border-radius: 7px; background: #d8dee8; }
    .line.short { width: 62%; margin-top: 11px; background: #e7eaf0; }
    .button { margin-top: 30px; padding: 14px; border-radius: 12px; background: #6c5dcc; color: white; text-align: center; font-size: 19px; font-weight: 800; }
    .check { position: absolute; right: -24px; top: -24px; width: 78px; height: 78px; display: grid; place-items: center; border: 8px solid #edf0f6; border-radius: 50%; background: #6c5dcc; color: white; font-size: 38px; font-weight: 900; }
  </style>
</head>
<body>
  <section>
    <div class="kicker">UNIPUS POPUP CLICKER</div>
    <h1>Routine dialogs,<br>handled locally.</h1>
    <p>Python · Playwright · Local browser profile</p>
  </section>
  <section class="card" aria-label="Synthetic demo dialog">
    <div class="check">✓</div>
    <div class="icon">!</div>
    <div class="line"></div><div class="line short"></div>
    <div class="button">确定</div>
  </section>
</body>
</html>
