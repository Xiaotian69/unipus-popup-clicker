<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1600, initial-scale=1">
  <title>Unipus Popup Clicker Hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 720px; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      align-items: center;
      padding: 84px 104px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: linear-gradient(132deg, #f6f8fb 0%, #e8edf5 60%, #e2e6f2 100%);
    }
    body::before {
      content: "";
      position: absolute;
      width: 660px;
      height: 660px;
      right: -120px;
      top: -240px;
      border-radius: 50%;
      background: rgba(108, 93, 204, .13);
    }
    .copy { position: relative; z-index: 2; max-width: 780px; }
    .kicker { margin-bottom: 24px; color: #6659ba; font-size: 20px; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; max-width: 780px; font-size: 72px; line-height: 1.03; letter-spacing: -.048em; }
    .tagline { margin: 28px 0 34px; color: #536079; font-size: 30px; line-height: 1.35; }
    .stack { color: #6d7890; font-size: 19px; font-weight: 700; letter-spacing: .04em; }
    .visual { position: relative; height: 460px; }
    .browser {
      position: absolute;
      inset: 28px 0 0 46px;
      border: 1px solid rgba(75, 85, 120, .18);
      border-radius: 24px;
      background: rgba(250, 252, 255, .92);
      box-shadow: 0 36px 80px rgba(50, 61, 89, .20);
      overflow: hidden;
    }
    .bar { height: 54px; display: flex; align-items: center; gap: 9px; padding: 0 20px; border-bottom: 1px solid #dfe4ec; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #b8c0ce; }
    .address { width: 310px; height: 24px; margin-left: 12px; border-radius: 8px; background: #eef1f6; }
    .content { display: grid; place-items: center; height: 355px; background: linear-gradient(150deg, #f7f9fc, #edf1f7); }
    .dialog { width: 360px; padding: 28px; border: 1px solid #ddd9f1; border-radius: 18px; background: white; box-shadow: 0 20px 50px rgba(49, 55, 77, .14); }
    .icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; background: #edeafd; color: #6557bf; font-size: 24px; font-weight: 900; }
    .line { height: 11px; margin-top: 18px; border-radius: 6px; background: #d9dee8; }
    .line.short { width: 64%; margin-top: 10px; background: #e7eaf0; }
    .button { margin-top: 24px; padding: 12px; border-radius: 11px; background: #6c5dcc; color: white; text-align: center; font-weight: 800; }
    .badge {
      position: absolute;
      right: -15px;
      bottom: 0;
      display: grid;
      place-items: center;
      width: 112px;
      height: 112px;
      border: 10px solid #eef1f7;
      border-radius: 50%;
      background: #6c5dcc;
      color: white;
      font-size: 54px;
      font-weight: 900;
      box-shadow: 0 18px 34px rgba(71, 59, 151, .30);
    }
  </style>
</head>
<body>
  <section class="copy">
    <div class="kicker">UNIPUS POPUP CLICKER</div>
    <h1>Routine dialogs,<br>handled locally.</h1>
    <p class="tagline">A focused browser helper for user-provided pages.</p>
    <div class="stack">Python · Playwright · Local browser profile</div>
  </section>
  <section class="visual" aria-label="Synthetic notification demo">
    <div class="browser">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address"></span></div>
      <div class="content">
        <div class="dialog">
          <div class="icon">!</div>
          <div class="line"></div><div class="line short"></div>
          <div class="button">确定</div>
        </div>
      </div>
    </div>
    <div class="badge">✓</div>
  </section>
</body>
</html>
